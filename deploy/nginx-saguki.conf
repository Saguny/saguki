# nginx site for Saguki. Install once on the VPS:
#   sudo cp /opt/saguki/deploy/nginx-saguki.conf /etc/nginx/sites-available/saguki
#   sudo ln -s /etc/nginx/sites-available/saguki /etc/nginx/sites-enabled/saguki
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d saguki.off-by-one.digital   # adds the HTTPS (443) block
server {
    listen 80;
    listen [::]:80;
    server_name saguki.off-by-one.digital;

    client_max_body_size 20m; # sync pushes and imports

    location / {
        proxy_pass http://127.0.0.1:8787; # API_PORT in /opt/saguki/deploy/.env
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

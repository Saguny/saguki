<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Zero</title>
<style>
/* everything is bundled so she works offline: the app serves assets/ on 127.0.0.1 */
@font-face{font-family:Inter;src:url(../fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:Caveat;src:url(../fonts/Caveat.ttf);font-weight:400 700}
:root{--bg:#0E0D12;--s1:#16151C;--s2:#1E1C26;--s3:#272433;--border:#2E2B3A;--text:#ECEAF2;--text2:#A9A5B8;--text3:#6F6B80;--accent:#B9A7FF;--accentC:#2C2547;--onAccent:#17132A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent;user-select:none}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 38%,var(--sky,#231d3a) 0%,#15131d 55%,var(--bg) 100%)}
#glow{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 2s;background:radial-gradient(circle at 92% 62%,rgba(255,190,120,.16),transparent 45%)} /* her desk lamp, at night */
#stage canvas{display:block;touch-action:none}
#fade{position:fixed;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,var(--bg) 85%);pointer-events:none}
#note{position:fixed;left:16px;top:18px;min-width:96px;max-width:128px;padding:13px 12px 9px;background:linear-gradient(#d9d1ee,#cbc2e3);color:#2a2340;font-family:Caveat,cursive;font-weight:700;transform:rotate(-4deg);transform-origin:50% 0;box-shadow:0 8px 16px rgba(0,0,0,.5);border-radius:2px 2px 6px 2px;pointer-events:none;filter:brightness(.88)}
#note::before{content:"";position:absolute;left:50%;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8e0ff,var(--accent) 55%,#6b5aa8);box-shadow:0 2px 3px rgba(0,0,0,.5)}
#noteBig{font-size:30px;line-height:.95;font-variant-numeric:tabular-nums}
#noteSmall{font-size:19px;line-height:1.05;color:#4d4369;margin-top:2px}
#dresser{position:fixed;z-index:2;right:-14px;bottom:-20px;width:min(52vw,240px);cursor:pointer;filter:drop-shadow(0 -6px 18px rgba(0,0,0,.5));transition:transform .2s}
#dresser:active{transform:translateY(2px)}
#plant ellipse{transition:fill 1s}
.drop{animation:drop 1.1s ease-in forwards;opacity:0}
@keyframes drop{0%{opacity:0;transform:translateY(-14px)}20%{opacity:.9}100%{opacity:0;transform:translateY(16px)}}
#sbtn{position:fixed;z-index:3;top:16px;right:52px;padding:6px 8px;font-size:12px;color:var(--text3);cursor:pointer}
#bubble{position:fixed;left:50%;top:104px;transform:translate(-50%,6px);max-width:min(78vw,320px);padding:10px 14px;border-radius:14px;background:rgba(30,28,38,.92);border:1px solid var(--border);font-size:15px;line-height:1.35;text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#bubble.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;cursor:pointer}
#bubble .zh{font-size:17px;font-family:Inter,"Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
#bubble .en{font-size:12px;color:var(--text2);margin-top:2px;transition:filter .3s}
#bubble .en.hide{filter:blur(4px)} /* heard it enough: try without the English (tap to peek) */
#bubble .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
#bubble .chips button{font:inherit;font-size:13px;padding:6px 10px;border-radius:10px;border:1px solid var(--border);background:var(--s3);color:var(--text);cursor:pointer}
#bubble .chips button.ok{background:var(--accentC);color:var(--accent);border-color:var(--accent)}
#mute{position:fixed;z-index:3;top:12px;right:10px;width:36px;height:36px;display:grid;place-items:center;color:var(--text3);cursor:pointer}
#mute svg{width:20px;height:20px}#mute .x{display:none}#mute.off .x{display:inline}#mute.off .w{display:none}
#zz{position:fixed;font-weight:600;color:var(--accent);opacity:0;pointer-events:none;transition:opacity 1s}
#zz span{position:absolute;animation:zz 3s infinite ease-out;opacity:0}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}25%{opacity:.9}100%{opacity:0;transform:translate(22px,-46px) scale(1.1)}}
.sheet{position:fixed;z-index:4;left:0;right:0;bottom:0;max-height:52%;overflow:auto;overscroll-behavior:contain;background:var(--s1);border-top:1px solid var(--border);border-radius:18px 18px 0 0;padding:10px 20px 28px;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--s3);margin:0 auto 14px}
.sheet h3{margin:0 0 2px;font-size:17px;font-weight:600}
.sheet p{margin:0 0 14px;font-size:13px;color:var(--text3)}
/* same shape as the app's Group: caps header, rounded block, inset dividers */
.gh{margin:18px 16px 6px;font-size:12px;font-weight:500;color:var(--text3);text-transform:uppercase}
.group{background:var(--s2);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;font-size:16px;position:relative;cursor:pointer}
.item+.item::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:1px solid var(--border)}
.item span{flex:1}
.item.locked{color:var(--text3);cursor:default}
.cost{display:flex;align-items:center;gap:5px;font-size:14px;font-variant-numeric:tabular-nums}
.cost svg{width:16px;height:16px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--s3);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--text2);transition:transform .2s,background .2s}
.item.on .sw{background:var(--accent)}
.item.on .sw::after{transform:translateX(18px);background:var(--onAccent)}
.row{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:14px;color:var(--text2)}
.row label{width:120px}.row input{flex:1;accent-color:var(--accent)}.row b{width:54px;text-align:right;color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);padding:10px 16px;border-radius:12px;background:var(--accentC);color:var(--accent);font-weight:600;font-size:14px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<script src="lib/live2dcubismcore.min.js"></script><!-- Cubism Core 5.1 (Live2D) -->

</head><body>
<div id="stage"></div><div id="glow"></div><div id="fade"></div>
<div id="note"><div id="noteBig"></div><div id="noteSmall"></div></div>

<div id="zz"><span style="animation-delay:0s">z</span><span style="left:10px;top:-8px;font-size:1.3em;animation-delay:1s">z</span><span style="left:20px;top:-18px;font-size:1.6em;animation-delay:2s">Z</span></div>

<svg id="dresser" viewBox="0 0 200 180" role="button" aria-label="Closet">

    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a5168"/><stop offset="1" stop-color="#3c3548"/></linearGradient>
  </defs>
  <!-- plant: a leaf per week of your streak, wilts when you skip days (plant()) -->
  <g id="plant"></g><g id="drops" fill="#9fc4ff"></g>

  <!-- books -->
  <rect x="40" y="50" width="58" height="8" rx="1.5" fill="#6d6194"/>

  <rect x="42" y="36" width="54" height="7" rx="1.5" fill="#8a7fb0"/>
  <path d="M94 36v7" stroke="#e4def2" stroke-opacity=".35"/>
  <!-- body -->
  <rect x="0" y="58" width="200" height="15" rx="4" fill="#3a3446"/>
  <rect x="0" y="58" width="200" height="3" rx="1.5" fill="#564e64"/>
  <rect x="8" y="73" width="192" height="120" fill="url(#dw)"/>
  <rect x="8" y="73" width="192" height="5" fill="#000" opacity=".25"/>
  <rect x="18" y="84" width="174" height="44" rx="4" fill="url(#dd)" stroke="#37313f"/>
  <rect x="18" y="136" width="174" height="44" rx="4" fill="url(#dd)" stroke="#37313f"/>
  <rect x="87" y="102" width="36" height="6" rx="3" fill="#9289a6" opacity=".75"/>
  <rect x="87" y="154" width="36" height="6" rx="3" fill="#9289a6" opacity=".75"/>
  <!-- her ribbon caught in the top drawer -->
  <path d="M52 127c-3 10 2 18-4 29l8-1c3-11-1-19 3-28z" fill="#0f0d12"/>
  <path d="M59 127c4 9 1 16 8 25l5-3c-5-8-2-15-6-22z" fill="#16131a"/>
  <path d="M50 128h20" stroke="#000" stroke-opacity=".6" stroke-width="2"/>
</svg>
<div id="sbtn">sim</div>
<div id="mute" title="Voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="x" d="m16 9 6 6m0-6-6 6"/></svg></div>
<div class="sheet" id="wsheet"><div class="grab"></div><h3>Her closet</h3><p id="close"></p><div id="wgrid"></div></div>
<div class="sheet" id="ssheet"><div class="grab"></div><h3>Simulate study state</h3><div id="sim"></div></div>
<script>
// ---------- study state: the app pushes it in through zeroState(); opened in a browser, sample values + the sim sheet ----------
const APP = location.search.includes('app');
// missed = whole days skipped before today, again = today's Again answers, words = [{t, m}] you studied lately
const S = APP ? { total: 0, today: 0, due: 0, missed: 0, again: 0, streak: 0, words: [], hour: new Date().getHours(), day: '' }
  : { total: 640, today: 0, due: 42, missed: 0, again: 0, streak: 12, hour: new Date().getHours(), day: '',
      words: [{ t: '謝謝', m: 'thank you' }, { t: '早安', m: 'good morning' }, { t: '對不起', m: 'sorry' }, { t: '再見', m: 'goodbye' }] };
// what she remembers between visits: outfit, today's forgiveness, how many unlocks you've seen
let store = {};
try { store = JSON.parse(localStorage.getItem('zero') || '{}'); } catch {}
const save = () => { try { localStorage.setItem('zero', JSON.stringify(store)); } catch {} };
const UNLOCKS = [ // [id, name, total reviews, params, exclusive group]
  ['phones', 'Headphones', 100, { fase121: 1 }],
  ['ears', 'Cat ears', 500, { fase120: 1 }],
  ['coat', 'No jacket', 1500, { fase62: 1 }],
  ['game', 'Game time', 3000, null], // she plays when you're done for the day
  ['black', 'Black hair', 4000, { fase63: 1 }], // a multiply-color tint, see the renderer patch
  ['down', 'Hair down', 5000, { fase108: 1, fase107: 1 }, 'hair'],
  ['short', 'Short hair', 7500, { fase108: 1, fase109: 1 }, 'hair'],
  ['bun', 'Little bun', 10000, { fase108: 1, fase115: 1 }, 'hair'],
  ['chibi', 'Chibi', 20000, { fase88: 1, fase89: 1 }],
];
const worn = new Set(store.worn ?? ['phones']);
const unlocked = u => S.total >= u[2];

// ---------- moods ----------
let forgive = 0, forgiven = false; // pats chip away at a 3–6 day grudge; 7+ days doesn't budge
const late = () => S.hour < 5;
function mood() {
  if (S.today === 0) {
    if (S.missed >= 7) return 'cold';
    if (S.missed >= 3) return forgiven ? 'sulky' : 'angry';
    if (S.missed === 2) return 'teary';
    if (S.missed === 1) return 'lonely';
    return late() ? 'bedtime' : 'sleepy';
  }
  if (S.due > 0) return S.missed >= 2 && S.today < 20 ? 'reunion' : S.due <= 5 ? 'almost' : 'cheer';
  if (late()) return 'bedtime';
  return S.today >= 150 ? 'proud' : 'happy';
}
// A shuffled bag per pool, kept between visits: you hear every line before any comes round again.
function pick(pool) {
  const ls = LINES[pool];
  if (!ls) return null; // a pool from a newer lines.js than the one loaded
  const bags = store.bag ??= {}, last = store.last ??= {};
  let bag = (bags[pool] ?? []).filter(i => i < ls.length);
  if (!bag.length) {
    bag = [...ls.keys()].sort(() => Math.random() - 0.5);
    if (bag.length > 1 && bag[bag.length - 1] === last[pool]) [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]]; // never twice in a row
  }
  const i = bag.pop();
  bags[pool] = bag; last[pool] = i; save();
  return [pool, i];
}
const line = md => pick(md === 'sleepy' && !S.due ? 'nothingDue' : md);
const HOLE = /\{(?:(due|today|days|hour|did|yday)([张天点])|(word))\}/g, SILENT = /[♡♪～~…！？!?。，、,.「」\s]/g;
const UNIT = { 张: ['zhang', 999], 天: ['tian', 99], 点: ['dian', 23] };
const val = k => ({ due: S.due, today: S.today, days: S.missed, hour: S.hour, did, yday: yday(), word: word?.t ?? '', mean: word?.m ?? '' })[k];
let did = 0; // reviews you did while she wasn't looking
let word = null; // {t: term, m: meaning}: the studied word a {word} line is about
function render([pool, i]) {
  const [zh, en] = LINES[pool][i];
  return {
    zh: zh.replace(HOLE, (_, k, u, w) => w ? val('word') : val(k) + u),
    en: en.replace(/\{(due|today|days|hour|did|yday|word|mean)\}/g, (_, k) => val(k).toLocaleString()),
  };
}
// FNV-1a over code points, same as fnv() in tool/zero_voice.py
function wordClip(s) { let h = 0x811c9dc5; for (const c of s) h = Math.imul(h ^ c.codePointAt(0), 16777619) >>> 0; return `voice/w_${h.toString(16).padStart(8, '0')}.mp3`; }
// the clips that say a line, in order: must match the split in tool/zero_voice.py
function voiceClips([pool, i]) {
  const zh = LINES[pool][i][0], urls = [];
  let k = 0, from = 0;
  const part = text => { if (text.replace(SILENT, '')) urls.push(`voice/${pool}_${i}_${k}.mp3`); k++; };
  for (const m of zh.matchAll(HOLE)) {
    part(zh.slice(from, m.index));
    if (m[3]) urls.push(wordClip(val('word'))); // a word that isn't in a starter deck has no clip: skipped
    else { const [name, max] = UNIT[m[2]], n = val(m[1]); urls.push(`voice/${name}_${n > max ? 'many' : n}.mp3`); }
    from = m.index + m[0].length;
  }
  part(zh.slice(from));
  return urls;
}

// ---------- her days: a temperament for each, what she remembers, the calendar, how close you two are ----------
const dayKey = () => (S.day || new Date(Date.now() - 4 * 36e5).toISOString()).slice(0, 10); // after the 4 am rollover
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const TEMPERS = ['sweet', 'clingy', 'bratty', 'spacey'];
function temper() { // same all day, different tomorrow
  if (window.forceTemper) return window.forceTemper;
  let h = 7;
  for (const c of dayKey()) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return TEMPERS[h % TEMPERS.length];
}
const level = (l = store.love ?? 0) => l >= 250 ? 3 : l >= 100 ? 2 : l >= 30 ? 1 : 0;
function love(x, touch) { // touches add at most 3 a day, so closeness comes from showing up, not from tapping
  const d = dayKey(), before = level();
  if (touch) {
    const day = store.loveDay?.d === d ? store.loveDay : (store.loveDay = { d, n: 0 });
    x = Math.min(x, 3 - day.n); if (x <= 0) return; day.n += x;
  }
  store.love = Math.max(0, (store.love ?? 0) + x); save();
  const now = level();
  if (now > before) { R.heart = 3; R.blush = 3; setTimeout(() => say(['loveUp', now - 1]), 2600); }
  wardrobe();
}
const mem = store.mem ??= { pats: 0, rubs: 0, pokes: 0 };
const COUNTS = { pats: [10, 50, 100, 500, 1000], rubs: [10, 50, 200], pokes: [20, 100] };
const count = k => { mem[k]++; save(); return COUNTS[k].indexOf(mem[k]); }; // which milestone that was, or -1
function yday() { const p = store.days?.prev; return p && daysBetween(p.d, dayKey()) === 1 ? p.n : 0; }
const CAL = {
  '01-01': 'newYear', '02-14': 'valentine', '10-17': 'birthday', '10-31': 'halloween', '12-24': 'xmas', '12-25': 'xmas', // 10-17: the day she moved in
  '2026-02-17': 'lunar', '2027-02-06': 'lunar', '2028-01-26': 'lunar', '2029-02-13': 'lunar', '2030-02-03': 'lunar',
  '2026-09-25': 'midautumn', '2027-09-15': 'midautumn', '2028-10-03': 'midautumn', '2029-09-22': 'midautumn', '2030-09-12': 'midautumn',
};
const ANNIV = [7, 30, 100, 365];
const tod = () => S.hour >= 5 && S.hour < 10 ? 'morning' : S.hour >= 18 && S.hour < 23 ? 'evening' : null;
const rough = () => S.today >= 20 && S.again >= S.today * 0.3; // missed a lot today
function chatter(md, tp) { // idle talk: mostly her mood, sometimes the day's temperament, how close you are, a word, or yesterday
  const r = Math.random(), lv = level();
  if (S.today && S.words?.length && r > 0.86) { word = S.words[Math.random() * S.words.length | 0]; return pick('wordRecall'); }
  if (tod() && r > 0.78) return pick(tod());
  if (tp && rough() && r > 0.7) return pick('rough');
  if (tp && r < 0.25) return pick('temper_' + tp);
  if (tp && lv && r < 0.4) return pick('love' + lv);
  if (md === 'sleepy' && yday() >= 10 && r < 0.3) return pick('memYday');
  return line(md);
}
const STREAKS = [7, 30, 100, 365];
function brag() { // a streak milestone, a new best day, or more than yesterday: once a day each
  const d = dayKey(), best = store.best ?? 0, yd = yday();
  if (S.streak < (store.streakSeen ?? 0)) store.streakSeen = 0; // the streak broke: the next 7 is worth a word again
  const k = STREAKS.filter(x => x <= S.streak).pop();
  if (k && k > (store.streakSeen ?? 0)) { store.streakSeen = k; save(); R.heart = 3; R.bang = 1; plant(); return ['streak', STREAKS.indexOf(k)]; }
  store.best = Math.max(best, S.today);
  if (best >= 30 && S.today > best && store.recDay !== d) { store.recDay = d; save(); R.heart = 2.5; R.bang = 1; return pick('record'); }
  if (yd >= 10 && S.today > yd && store.beatDay !== d) { store.beatDay = d; save(); R.blush = 2; return pick('beatYday'); }
  save();
  return null;
}
// what she says when you come in: a holiday, an anniversary, a record, what you did while she wasn't looking,
// an odd hour for you, else just her mood
function welcome() {
  const d = dayKey(), md = mood(), cross = md === 'cold' || md === 'angry';
  let odd = null, firstToday = store.visitDay !== d;
  if (firstToday) { // first visit today: is this a strange time for you?
    store.visitDay = d;
    const hs = store.hours ?? [], usual = hs.length >= 5 ? [...hs].sort((a, b) => a - b)[hs.length >> 1] : null;
    store.hours = [...hs, S.hour].slice(-14);
    const dh = usual == null ? 0 : ((S.hour - usual + 36) % 24) - 12;
    odd = dh <= -4 ? 'visitEarly' : dh >= 4 ? 'visitLate' : null;
  }
  did = S.total - (store.seenTotal ?? S.total);
  const away = (Date.now() - (store.seenAt ?? Date.now())) / 6e4;
  store.seenTotal = S.total; store.seenAt = Date.now(); save();
  const p = store.promise; // you promised yesterday-you'd come: did you?
  if (p && p !== d) { delete store.promise; save(); if (daysBetween(p, d) === 1) { love(2); R.heart = 2.5; return pick('promiseKept'); } R.hurt = 2.5; return pick('promiseBroke'); }
  if (cross) return line(md);
  const h = CAL[d] ?? CAL[d.slice(5)];
  if (h && store.calDay !== d) { store.calDay = d; save(); R.blush = 2.5; if (h === 'birthday' || h === 'valentine') R.heart = 2.5; return pick('cal_' + h); }
  store.met ??= d;
  const a = ANNIV.filter(x => x <= daysBetween(store.met, d)).pop();
  if (a && a > (store.anniv ?? 0)) { store.anniv = a; save(); R.heart = 2.5; return ['anniv', ANNIV.indexOf(a)]; }
  const b = brag(); if (b) return b;
  if (did > 0 && rough() && store.roughDay !== d) { store.roughDay = d; save(); return pick('rough'); }
  if (did > 0) { R.bang = did >= 100 ? 1.2 : 0; return pick(did >= 60 && away >= 40 ? 'sessionTired' : did >= 100 ? 'sessionBig' : did >= 20 ? 'sessionGood' : 'sessionSmall'); }
  if (odd) return pick(odd);
  if (firstToday && tod() && !['sleepy', 'bedtime'].includes(md)) return pick(tod());
  return line(md);
}
// caught in the act: some visits you walk in on her busy with something, and she notices you a moment later
function catchHer() {
  const md = mood();
  if (['angry', 'cold', 'sleepy', 'bedtime'].includes(md) || Math.random() < 0.35) return false; // asleep, she's just dozing
  const opts = md === 'lonely' || md === 'teary' ? ['mope'] : ['sing', 'swab', 'swab'];
  if ((md === 'happy' || md === 'proud') && worn.has('game') && unlocked(UNLOCKS.find(u => u[0] === 'game'))) opts.push('game', 'game');
  caught = { what: opts[Math.random() * opts.length | 0], at: t + rnd(1.6, 2.6) };

let bubbleTimer, active = true, said = null;
const bubble = document.getElementById('bubble');
const hideBubble = s => { clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => bubble.classList.remove('on'), s * 1000); };
// [label zh, label en, onTap]: buttons under her line (a promise, a quiz); the bubble stays up until you answer
function say(ln, secs = 3.5, chips) { // resolves to how long she talks
  if (!active || !LINES[ln?.[0]]?.[ln[1]]) return Promise.resolve(0); // hidden tab: the app still pushes state, she stays quiet
  const { zh, en } = render(ln), b = bubble, key = ln[0] + '_' + ln[1];
  const heard = store.heard ??= {};
  b.innerHTML = '<div class="zh"></div><div class="en"></div>';
  b.firstChild.textContent = zh; b.lastChild.textContent = en; b.classList.add('on');
  // the English fades out once you've heard a line 3 times: listen first, tap the bubble to peek
  if (/\p{Script=Han}/u.test(zh) && (heard[key] ?? 0) >= 3) b.lastChild.classList.add('hide');
  heard[key] = (heard[key] ?? 0) + 1; save();
  said = ln;
  if (chips) {
    const row = document.createElement('div'); row.className = 'chips';
    for (const [lz, le, tap] of chips) {
      const btn = document.createElement('button'); btn.textContent = lz + (le ? ` · ${le}` : '');
      btn.onclick = e => { e.stopPropagation(); for (const x of row.children) x.disabled = true; btn.classList.add('ok'); tap(); };
      row.appendChild(btn);
    }
    b.appendChild(row); secs = Math.max(secs, 15);
  }
  R.talk = zh === '……' ? 0 : Math.min(1.6, 0.25 + zh.length * 0.12); // mouth flaps when she's muted
  R.inhale = 0.3;
  chatAt = Math.max(chatAt, t + 15);
  hideBubble(secs);
  return speak(voiceClips(ln)).then(d => { if (d) { R.talk = d; hideBubble(Math.max(secs, d + 0.8)); } return d; });
}
bubble.onclick = () => { // peek at the English and hear it again
  bubble.querySelector('.en')?.classList.remove('hide');
  if (said) speak(voiceClips(said)).then(d => { if (d) R.talk = d; });
  hideBubble(bubble.querySelector('.chips button:not(:disabled)') ? 15 : 4);
};

// ---------- voice: Xiaoyi clips (voice/, made by tool/zero_voice.py) played back to back ----------
let actx, analyser, levels, playing = [], speakId = 0, muted = !!store.muted, mouth = 0;
const buffers = {};
function audio() {
  if (!actx) {
    actx = new AudioContext(); analyser = actx.createAnalyser(); analyser.fftSize = 512;
    levels = new Float32Array(analyser.fftSize); analyser.connect(actx.destination);
  }
  return actx;
}
function trim(buf) { // the clips carry ~0.1 s of silence at each end; joined lines sound choppy with it
  const d = buf.getChannelData(0), pad = buf.sampleRate * 0.02 | 0;
  let a = 0, b = d.length - 1;
  while (a < b && Math.abs(d[a]) < 0.01) a++;
  while (b > a && Math.abs(d[b]) < 0.01) b--;
  a = Math.max(0, a - pad); b = Math.min(d.length, b + pad);
  const out = actx.createBuffer(1, b - a, buf.sampleRate);
  out.copyToChannel(d.subarray(a, b), 0);
  return out;
}
const clip = url => buffers[url] ??= fetch(url).then(r => r.ok ? r.arrayBuffer() : Promise.reject(url))
  .then(b => audio().decodeAudioData(b)).then(trim).catch(() => null);
async function speak(urls) { // resolves to how long she talks (0: muted / nothing to say)
  const id = ++speakId;
  for (const s of playing) try { s.stop(); } catch {}
  playing = [];
  if (muted || !urls.length) return 0;
  const bufs = (await Promise.all(urls.map(clip))).filter(Boolean);
  if (id !== speakId || !bufs.length) return 0;
  const ctx = audio();
  if (ctx.state === 'suspended') ctx.resume();
  let at = ctx.currentTime + 0.03;
  for (const b of bufs) {
    const src = ctx.createBufferSource();
    src.buffer = b; src.connect(analyser); src.start(at); at += b.duration + 0.04;
    src.onended = () => { playing = playing.filter(x => x !== src); };
    playing.push(src);
  }
  return at - ctx.currentTime;
}
function voiceLevel() {
  if (!playing.length) return 0;
  analyser.getFloatTimeDomainData(levels);
  let sum = 0;
  for (const v of levels) sum += v * v;
  return Math.sqrt(sum / levels.length);
}
addEventListener('pointerdown', () => actx?.state === 'suspended' && actx.resume(), true); // autoplay rules
const muteBtn = document.getElementById('mute');
muteBtn.classList.toggle('off', muted);
muteBtn.onclick = () => {
  muted = !muted; store.muted = muted; save(); muteBtn.classList.toggle('off', muted);
  if (muted) speak([]); else say(pick('pat'), 1.8);
};

// ---------- touch ----------
const view = app.view;
const local = e => m.toLocal(new PIXI.Point(e.clientX, e.clientY));
view.addEventListener('pointermove', e => {
  if (!m) return;
  const p = local(e);
  pointer = { x: clamp((p.x - FACE.x) / 1100, -1, 1), y: clamp((FACE.y - p.y) / 1100, -1, 1) };
  if (e.pointerType === 'mouse' || e.buttons) pointerAt = touchedAt = t;
  if (drag && e.buttons) {
    const d = Math.hypot(p.x - drag.x, p.y - drag.y); drag.x = p.x; drag.y = p.y; drag.dist += d;
    if (drag.dist >= 120) rub(d, p.x);
  }
});
view.addEventListener('pointerdown', e => {
  if (!m) return;
  closeSheets();
  const p = local(e), inside = r => p.x > r[0] && p.x < r[2] && p.y > r[1] && p.y < r[3];
  pointer = { x: clamp((p.x - FACE.x) / 1100, -1, 1), y: clamp((FACE.y - p.y) / 1100, -1, 1) }; pointerAt = touchedAt = t; interest = 1;
  if (caught) return notice(); // you walked in on her: the first touch is her noticing you
  if (inside(HEAD)) { drag = { x: p.x, y: p.y, dist: 0, side: p.x < FACE.x ? -1 : 1 }; rubFor = 0; rubLine = t + 0.4; try { view.setPointerCapture(e.pointerId); } catch {} }
  else if (inside(BODY)) poke();
});
const release = () => {
  if (!drag) return;
  const nice = !['cold', 'angry', 'sleepy', 'bedtime'].includes(mood());
  if (drag.dist < 120) pat(drag.side); // barely moved: that was a pat
  else {
    const ms = count('rubs');
    if (nice) love(0.5, true);
    if (nice && ms >= 0) { R.blush = R.heart = 2.5; say(['rubsCount', ms]); }
    else if (rubFor > 3000 && nice) say(pick('rubStop'), 2);
  }
  drag = null;
};
view.addEventListener('pointerup', release);
view.addEventListener('pointercancel', release);

// phone tilt leans her (the physics swing her hair), a few hard shakes make her dizzy. Nothing happens without a motion sensor.
const TILT = 1; // ponytail: sign guessed, not checked on a phone; flip to -1 if she leans the wrong way
let jolt = false;
addEventListener('devicemotion', e => {
  const g = e.accelerationIncludingGravity, a = e.acceleration;
  if (g?.x != null) tiltG = clamp(g.x / 9.8, -1, 1) * TILT;
  const hard = a?.x != null && Math.hypot(a.x, a.y, a.z) > 18;
  if (hard && !jolt && active) {
    shakes = shakes.filter(x => t - x < 1.5); shakes.push(t);
    if (shakes.length >= 4 && !R.dizzy) { shakes = []; R.dizzy = 3; R.sweat = 2; say(pick('shake')); }
  }
  jolt = hard;
});

function rub(d, x) {
  const md = mood(), sleepy = (md === 'sleepy' || md === 'bedtime') && !R.awake;
  R.rub = 0.35; rubX = clamp((x - FACE.x) / 450, -1, 1); rubFor += d;
  const talk = pool => { if (t > rubLine) { rubLine = t + rnd(3.5, 5.5); say(pick(pool), 2.2); } };
  if (md === 'cold') { // she leans away; a long enough rub cracks her for a second
    dodgeDir = rubX < 0 ? -1 : 1; R.dodge = 1.2;
    if (rubFor > 12000 && !R.hurt) { R.hurt = 3; rubFor = 0; rubLine = t + 5; return say(pick('coldCrack')); }
    return talk('patCold');
  }
  if (md === 'angry') {
    forgive += d / 2500;
    if (forgive >= 6) { forgiven = true; store.forgiven = S.day; R.blush = 3; hud(); rubLine = t + 4; return say(pick('forgiveRub')); }
    if (t > rubLine) { rubLine = t + 3.5; say(['rubAngry', Math.min(3, forgive / 1.5 | 0)], 2); }
    return;
  }
  if (rubFor > 6000 && !sleepy && md !== 'lonely' && md !== 'teary') R.heart = 0.5;
  talk(sleepy ? 'rubSleepy' : md === 'sulky' ? 'rubSulky' : md === 'lonely' || md === 'teary' ? 'rubSad'
    : worn.has('ears') && Math.random() < 0.4 ? 'rubCat' : 'rub');
}

function pat(side) {
  const md = mood();
  pats = pats.filter(x => t - x < 1.6); pats.push(t);
  const first = pats.length === 1, ms = count('pats');
  if ((md === 'sleepy' || md === 'bedtime') && !R.awake) {
    R.awake = 12; R.bang = 1.2; R.sweat = 1.2;
    return say(pick(md === 'bedtime' ? 'wakeBed' : S.due ? 'wakeDue' : 'wakeNone'));
  }
  if (md === 'cold') { // flinches away, every so often the hurt shows through
    dodgeDir = side; R.dodge = 1.4; forgive++;
    if (forgive % 5 === 0) { R.hurt = 3; return say(pick('coldHurt')); }
    return first && say(pick('patCold'), 2);
  }
  if (md === 'angry') {
    forgive++;
    if (forgive >= 6) { forgiven = true; store.forgiven = S.day; R.blush = 3; R.bang = 0.8; hud(); return say(pick('forgivePat')); }
    if (forgive <= 3) { dodgeDir = side; R.dodge = 1.2; R.huff = 1.5; }
    return say(['angryPat', forgive - 1], 2);
  }
  tiltDir = side; R.tilt = 1.2; // leans into the hand, like a rub
  love(0.15, true);
  if (ms >= 0 && md !== 'lonely' && md !== 'teary') { R.blush = 2.5; R.heart = 2; return say(['patsCount', ms]); } // "that's the 100th time"
  if (pats.length >= 5 && md !== 'lonely' && md !== 'teary') { R.dizzy = 3; R.blush = R.heart = 0; pats = []; return say(pick('dizzy')); }
  if (R.dizzy) return;
  if (md === 'lonely' || md === 'teary') { R.blush = 2; R.hurt = md === 'teary' ? 2.5 : 0; return first && say(pick('patSad'), 2.2); }
  if (md === 'sulky') { R.blush = 2.5; return first && say(pick('patSulky'), 2); }
  const tp = temper();
  if (first && tp === 'bratty' && Math.random() < 0.35) { R.huff = 1.2; R.blush = 2; return say(pick('patBratty'), 2); }
  R.blush = 2.5; R.heart = pats.length >= 2 || tp === 'clingy' ? 2 : 0;
  if (first) say(pick(md === 'cheer' || md === 'almost' || md === 'reunion' ? (Math.random() < 0.5 ? 'patCheer' : 'pat') : 'pat'), 1.8);
}

function poke() {
  const md = mood();
  pokes = pokes.filter(x => t - x < 4); pokes.push(t);
  const ms = count('pokes');
  if (ms === 1 && md !== 'cold') { pokes = []; R.fly = 1.4; R.bang = 2; R.sweat = 3; return say(pick('headFly'), 2).then(() => setTimeout(() => { R.huff = 2; say(['pokesCount', ms]); }, 2200)); } // the 100th
  if (ms >= 0 && md !== 'cold') { pokes = []; R.huff = 2; R.blush = 2; R.bang = 1; return say(['pokesCount', ms]); }
  if (pokes.length >= 3 && md !== 'cold') { pokes = []; R.turn = 5; R.huff = 2; R.blush = 2; return say(pick('ignore')); }
  if (md === 'cold') { R.squint = 1.5; return say(pick('pokeCold'), 1.6); }
  if (md === 'angry') { R.huff = 1.5; R.bang = 1; return say(pick('pokeAngry'), 1.8); }
  if (md === 'lonely' || md === 'teary') { R.qmark = 1.5; return say(pick('pokeSad'), 1.8); }
  if (md === 'sleepy' || md === 'bedtime') { R.awake = 12; }
  R.bang = 1; R.sweat = 1.5; R.squint = 1.5; R.blush = 1.5; say(pick('poke'), 1.6);
}

// ---------- HUD, wardrobe, simulator ----------
// the sticky note on her wall, in her handwriting
function hud() {
  const n = x => x.toLocaleString(), days = `${S.missed} day${S.missed === 1 ? '' : 's'}`;
  const [big, small] = {
    sleepy: S.due ? [n(S.due), 'cards waiting'] : ['0', 'nothing due ♡'],
    bedtime: S.today ? [n(S.today), 'now sleep!!'] : [n(S.due), 'tomorrow…'],
    cheer: [`${n(S.due)} left`, `${n(S.today)} done today`],
    almost: [`${n(S.due)} left`, 'almost!!'],
    happy: [n(S.today), 'cards today ♡'],
    proud: [`${n(S.today)}!!`, 'cards today ★'],
    reunion: [n(S.today), 'you came back'],
    lonely: [days, 'missed you'],
    teary: [days, '…'],
    angry: [days, 'hmph.'],
    sulky: [days, 'forgiven. barely.'],
    cold: [days, ''],
  }[mood()];
  document.getElementById('noteBig').textContent = big;
  document.getElementById('noteSmall').textContent = small;
  document.getElementById('noteSmall').style.display = small ? '' : 'none';
  plant(); sky();
}
// Icons.style_outlined, the app's card icon
const CARD = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.53 19.65l1.34.56v-9.03l-2.43 5.86c-.41 1.02.08 2.19 1.09 2.61zm19.5-3.7L17.07 3.98c-.31-.75-1.04-1.21-1.81-1.23-.26 0-.53.04-.79.15L7.1 5.95c-.75.31-1.21 1.03-1.23 1.8-.01.27.04.54.15.8l4.96 11.97c.31.76 1.05 1.22 1.83 1.23.26 0 .52-.05.77-.15l7.36-3.05c1.02-.42 1.51-1.59 1.09-2.6zm-9.2 3.8L7.87 7.79l7.35-3.04h.01l4.95 11.95-7.35 3.05z"/><circle cx="11" cy="9" r="1"/><path d="M5.88 19.75c0 1.1.9 2 2 2h1.45l-3.45-8.34v6.34z"/></svg>';
function wardrobe() {
  store.worn = [...worn]; save();
  const lv = level();
  document.getElementById('close').textContent = `Closeness ${'♥'.repeat(lv)}${'♡'.repeat(3 - lv)}`;
  const have = UNLOCKS.filter(unlocked), locked = UNLOCKS.filter(u => !unlocked(u));
  const group = (head, rows) => rows.length ? `<div class="gh">${head}</div><div class="group">${rows.join('')}</div>` : '';
  document.getElementById('wgrid').innerHTML =
    group('Unlocked', have.map(u => `<div class="item ${worn.has(u[0]) ? 'on' : ''}" data-id="${u[0]}"><span>${u[1]}</span><div class="sw"></div></div>`)) +
    group('Locked', locked.map(u => `<div class="item locked"><span>${u[1]}</span><div class="cost">${CARD}${u[2].toLocaleString()}</div></div>`));
}
document.getElementById('wgrid').onclick = e => {
  const el = e.target.closest('.item[data-id]'); if (!el) return;
  const u = UNLOCKS.find(x => x[0] === el.dataset.id);
  if (worn.has(u[0])) worn.delete(u[0]);
  else {
    if (u[4]) for (const x of UNLOCKS) if (x[4] === u[4]) worn.delete(x[0]);
    worn.add(u[0]);
    const md = mood();
    if (md === 'cold' || md === 'angry') say(md === 'cold' ? ['cold', 0] : pick('outfitAngry'), 1.8);
    else { R.bang = 0.8; say(pick('outfit'), 1.8); }
  }
  wardrobe();
};
const sliders = [['total', 'Total reviews', 0, 30000, 10], ['today', 'Reviewed today', 0, 300, 1], ['due', 'Cards due', 0, 300, 1], ['missed', 'Days missed', 0, 10, 1], ['again', 'Again today', 0, 300, 1], ['streak', 'Streak', 0, 400, 1], ['hour', 'Hour', 0, 23, 1]];
document.getElementById('sim').innerHTML = sliders.map(([k, n, a, b, st]) => `<div class="row"><label>${n}</label><input type="range" min="${a}" max="${b}" step="${st}" value="${S[k]}" data-k="${k}"><b id="v_${k}">${S[k]}</b></div>`).join('');
document.getElementById('sim').oninput = e => {
  const k = e.target.dataset.k, before = mood(), was = UNLOCKS.filter(unlocked).length;
  S[k] = +e.target.value; document.getElementById('v_' + k).textContent = S[k].toLocaleString();
  if (k === 'missed' || (k === 'today' && S.today > 0)) { forgive = 0; forgiven = false; }
  const now = UNLOCKS.filter(unlocked);
  if (now.length > was) { const u = now[now.length - 1]; toast(`Unlocked: ${u[1]}`); worn.add(u[0]); if (u[4]) for (const x of UNLOCKS) if (x[4] === u[4] && x !== u) worn.delete(x[0]); R.bang = 1.5; say(pick('unlock_' + u[0])); }
  else if (mood() !== before) say(line(mood()));
  hud(); wardrobe();
};
function toast(s) { const el = document.getElementById('toast'); el.textContent = s; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 2200); }
const sheets = { dresser: 'wsheet', sbtn: 'ssheet' };
function closeSheets() { for (const s of Object.values(sheets)) document.getElementById(s).classList.remove('on'); }
for (const [b, s] of Object.entries(sheets)) document.getElementById(b).onclick = () => { const el = document.getElementById(s), on = el.classList.contains('on'); closeSheets(); if (!on) el.classList.add('on'); };
// ---------- the app's side ----------
window.zeroState = st => {
  const first = !greeted, before = mood();
  Object.assign(S, st);
  if (st.accent) document.documentElement.style.setProperty('--accent', st.accent);
  forgiven = !!S.day && store.forgiven === S.day;
  const d = dayKey(), dy = store.days ??= {};
  if (dy.cur?.d !== d) { if (dy.cur) dy.prev = dy.cur; dy.cur = { d, n: 0 }; }
  dy.cur.n = S.today;
  if (S.today > 0 && store.studyDay !== d) { store.studyDay = d; love(3); } // showing up is what brings you closer
  if (S.missed >= 2 && S.today === 0 && store.missDay !== d) { store.missDay = d; love(-(S.missed - 1) * 2); }
  save();
  const now = UNLOCKS.filter(unlocked), seen = store.seen ?? now.length; // first launch: nothing to celebrate
  if (now.length > seen) {
    const fresh = now.slice(seen), u = fresh[fresh.length - 1];
    for (const x of fresh) { if (x[4]) for (const y of UNLOCKS) if (y[4] === x[4]) worn.delete(y[0]); worn.add(x[0]); }
    toast(`Unlocked: ${u[1]}`); R.bang = 1.5; say(pick('unlock_' + u[0]));
  } else if (first && active) greet();
  else if (active && !caught) { const b = greeted && brag(); if (b) say(b); else if (mood() !== before) say(line(mood())); if (greeted) later(); }
  store.seen = now.length;
  hud(); wardrobe();
};
// the app stops her ticker while her tab is hidden, and she says hi again if you've been gone a while
window.zeroActive = on => {
  active = on;
  if (!on) {
    app.ticker.stop(); closeSheets(); speak([]); document.getElementById('bubble').classList.remove('on'); caught = null;
    store.seenTotal = S.total; store.seenAt = Date.now(); save(); // so she can tell what you did while you were gone
    return;
  }
  app.ticker.start();
  if (greeted && performance.now() - greetedAt > 90e3) setTimeout(greet, 400);
};
if (APP) { document.getElementById('sbtn').remove(); document.getElementById('ssheet').remove(); delete sheets.sbtn; }
hud(); wardrobe();
</script>

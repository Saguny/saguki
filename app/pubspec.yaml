name: saguki
description: "Saguki: offline-first flashcards for language learning."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_inappwebview: 6.2.0-beta.3
  flutter_local_notifications: ^22.3.2
  flutter_tts: ^4.2.5
  fsrs: ^2.0.1
  http: ^1.6.0
  path_provider: ^2.1.6
  sqlite3: ^3.7.1
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/zero/
    - assets/zero/model/
    - assets/zero/lib/
    - assets/zero/voice/
    - assets/starter/
    - assets/fonts/Caveat.ttf
  fonts:
    - family: Inter
      fonts: [{asset: assets/fonts/Inter.ttf}]
    - family: NotoSansJP
      fonts: [{asset: assets/fonts/NotoSansJP.ttf}]
    - family: NotoSansTC
      fonts: [{asset: assets/fonts/NotoSansTC.ttf}]
